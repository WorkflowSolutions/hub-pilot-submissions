<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub Pilot Agency Submissions</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .step-connector { flex: 1; height: 2px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="root"></div>
<script type="text/babel">
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/domain.com.au/s/AKfycbzWswWbufhy_JseRCMynOKqQvIgAQvGC5NWF2BtXuIxU2ebJs2AY5fWIrb0--nQNDEj/exec';
const CONTACT_EMAIL   = 'angela.yu@costar.com';
const ADMIN_SECRET    = 'hub2024';
const { useState, useEffect } = React;
const genId   = () => Math.random().toString(36).slice(2, 10);
const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtDT   = (iso) => iso ? new Date(iso).toLocaleString('en-AU', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
function useSubmissions() {
  const [submissions, setSubmissions] = useState([]);
  useEffect(() => {
    if (APPS_SCRIPT_URL) { fetch(APPS_SCRIPT_URL + '?action=getAll').then(r => r.json()).then(setSubmissions).catch(loadLocal); }
    else { loadLocal(); }
  }, []);
  function loadLocal() { try { setSubmissions(JSON.parse(localStorage.getItem('hubSubmissions') || '[]')); } catch { setSubmissions([]); } }
  function persist(arr) { localStorage.setItem('hubSubmissions', JSON.stringify(arr)); setSubmissions(arr); }
  async function addSubmission(data) {
    const entry = { ...data, id: genId(), submittedAt: new Date().toISOString(), status: 'Waitlist', approvedAt: null, liveAt: null };
    if (APPS_SCRIPT_URL) { await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ action:'submit', data: entry }) }); setSubmissions(prev => [...prev, entry]); }
    else { persist([...submissions, entry]); }
    return entry;
  }
  async function updateSubmission(id, patch) {
    const updated = submissions.map(s => s.id === id ? { ...s, ...patch } : s);
    if (APPS_SCRIPT_URL) { await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ action:'update', id, patch }) }); setSubmissions(updated); }
    else { persist(updated); }
  }
  return { submissions, addSubmission, updateSubmission };
}
function Label({ children, required }) { return <label className="block text-sm font-medium text-gray-700 mb-1">{children}{required && <span className="text-red-500 ml-1">*</span>}</label>; }
function Input({ className='', ...p }) { return <input className={`w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 ${className}`} {...p} />; }
function Sel({ className='', children, ...p }) { return <select className={`w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white ${className}`} {...p}>{children}</select>; }
function Btn({ variant='primary', className='', ...p }) {
  const v = { primary:'bg-blue-600 text-white hover:bg-blue-700', secondary:'bg-white border border-gray-300 text-gray-700 hover:bg-gray-50' };
  return <button className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed ${v[variant]||v.primary} ${className}`} {...p} />;
}
function Badge({ status }) {
  const c = { Waitlist:'bg-yellow-100 text-yellow-800', Approved:'bg-green-100 text-green-800', Live:'bg-blue-100 text-blue-800' };
  return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${c[status]||'bg-gray-100 text-gray-700'}`}>{status}</span>;
}
function Card({ className='', children }) { return <div className={`bg-white rounded-xl shadow-sm border border-gray-200 ${className}`}>{children}</div>; }
function Toggle({ label, value, onChange }) {
  return (
    <div className="flex items-center justify-between py-2 border-b border-gray-100 last:border-0">
      <span className="text-sm text-gray-700">{label}</span>
      <div className="flex gap-2">
        {['Yes','No'].map(o => (
          <button key={o} type="button" onClick={() => onChange(o)}
            className={`px-3 py-1 rounded-md text-xs font-medium border transition-colors ${value===o ? (o==='Yes' ? 'bg-green-600 text-white border-green-600' : 'bg-red-500 text-white border-red-500') : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>{o}</button>
        ))}
      </div>
    </div>
  );
}
function Nav({ page, setPage }) {
  const tabs = [['submit','Submit Agency'],['waitlist','Waitlist'],['approved','Approved & Live'],['admin','Admin']];
  return (
    <nav className="bg-white border-b border-gray-200 sticky top-0 z-10">
      <div className="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
        <div className="flex items-center gap-2">
          <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">H</div>
          <span className="font-semibold text-gray-900">Hub Pilot Agencies</span>
        </div>
        <div className="flex gap-1">
          {tabs.map(([id, label]) => (
            <button key={id} onClick={() => setPage(id)} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-colors ${page===id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-100'}`}>{label}</button>
          ))}
        </div>
      </div>
    </nav>
  );
}
function StepBar({ steps, current }) {
  return (
    <div className="flex items-center mb-8">
      {steps.map((s, i) => (
        <React.Fragment key={i}>
          <div className="flex flex-col items-center">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-medium border-2 transition-colors ${i < current ? 'bg-blue-600 border-blue-600 text-white' : i === current ? 'border-blue-600 text-blue-600' : 'border-gray-300 text-gray-400'}`}>{i < current ? '✓' : i + 1}</div>
            <span className={`text-xs mt-1 text-center max-w-[70px] ${i === current ? 'text-blue-600 font-medium' : 'text-gray-400'}`}>{s}</span>
          </div>
          {i < steps.length - 1 && <div className={`step-connector mx-2 mb-4 ${i < current ? 'bg-blue-600' : 'bg-gray-200'}`} />}
        </React.Fragment>
      ))}
    </div>
  );
}
function RSection({ title, children }) { return <div><p className="text-xs font-semibold uppercase tracking-wide text-gray-400 mb-2">{title}</p><div className="bg-gray-50 rounded-lg divide-y divide-gray-100">{children}</div></div>; }
function RRow({ label, value }) { return <div className="flex justify-between px-3 py-2"><span className="text-gray-500">{label}</span><span className="text-gray-900 font-medium text-right max-w-xs">{value}</span></div>; }
const STEPS = ['Your Details','Confirm','Agency','Main User','Review'];
const EMPTY = { submitterName:'', submitterTitle:'', submitterEmail:'', checkedWaitlist:false, meetsCriteria:false, agencyName:'', brandName:'', ctAgencyId:'', rhAgencyId:'', marketingPlatform:'', artworkBuilder:'', userName:'', userRole:'', ctUsername:'', rhUserId:'', toggleCTAccess:'No', toggleRHAccess:'No', togglePrimaryContact:'Yes' };
function SubmitPage({ onSubmit, submissions }) {
  const [mode, setMode] = useState('choose'), [step, setStep] = useState(0), [form, setForm] = useState(EMPTY), [errors, setErrors] = useState({});
  const [editId, setEditId] = useState(null), [lookupEmail, setLookupEmail] = useState(''), [lookupAgency, setLookupAgency] = useState(''), [lookupErr, setLookupErr] = useState(''), [submitted, setSubmitted] = useState(null);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const err = (k) => errors[k] && <p className="text-red-500 text-xs mt-1">{errors[k]}</p>;
  function validate(s) {
    const e = {};
    if (s===0) { if (!form.submitterName.trim()) e.submitterName='Required'; if (!form.submitterTitle.trim()) e.submitterTitle='Required'; if (!form.submitterEmail.trim()) e.submitterEmail='Required'; else if (!form.submitterEmail.toLowerCase().endsWith('@costar.com')) e.submitterEmail='Must be a CoStar email'; }
    if (s===2) { if (!form.agencyName.trim()) e.agencyName='Required'; if (!form.brandName.trim()) e.brandName='Required'; if (!form.marketingPlatform) e.marketingPlatform='Required'; if (!form.artworkBuilder) e.artworkBuilder='Required'; }
    if (s===3) { if (!form.userName.trim()) e.userName='Required'; if (!form.userRole.trim()) e.userRole='Required'; }
    return e;
  }
  function next() { const e=validate(step); setErrors(e); if (Object.keys(e).length) return; setStep(s=>s+1); }
  function handleLookup() {
    setLookupErr('');
    const found = submissions.find(s => s.submitterEmail?.toLowerCase()===lookupEmail.toLowerCase() && s.agencyName?.toLowerCase()===lookupAgency.toLowerCase());
    if (!found) { setLookupErr('No submission found. Check your email and agency name.'); return; }
    setForm({ ...EMPTY, ...found }); setEditId(found.id); setMode('form'); setStep(0);
  }
  async function handleSubmit() { const entry = await onSubmit(form, editId); setSubmitted(entry); setMode('success'); }
  const mailtoLink = submitted ? (() => { const sub=encodeURIComponent(`Hub Pilot Submission Confirmed: ${submitted.agencyName}`); const body=encodeURIComponent(`Hi ${submitted.submitterName},\n\nThank you for submitting ${submitted.agencyName} to the Hub Pilot program.\n\nYour submission has been added to the waitlist.\n\n• Agency: ${submitted.agencyName}\n• Brand: ${submitted.brandName}\n• Platform: ${submitted.marketingPlatform}\n\nWe'll be in touch.\n\nHub Team`); return `mailto:${submitted.submitterEmail}?subject=${sub}&body=${body}`; })() : '#';
  if (mode==='choose') return (
    <div className="max-w-lg mx-auto mt-12 px-4"><Card className="p-8 text-center">
      <div className="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><svg className="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg></div>
      <h2 className="text-xl font-semibold text-gray-900 mb-2">Submit a Pilot Agency</h2>
      <p className="text-gray-500 text-sm mb-6">Nominate an agency for the Hub pilot program, or update an existing submission.</p>
      <div className="flex flex-col gap-3">
        <Btn onClick={() => { setForm(EMPTY); setEditId(null); setStep(0); setMode('form'); }}>Submit a new agency</Btn>
        <Btn variant="secondary" onClick={() => setMode('lookup')}>Edit an existing submission</Btn>
      </div>
    </Card></div>
  );
  if (mode==='lookup') return (
    <div className="max-w-lg mx-auto mt-12 px-4"><Card className="p-8">
      <button onClick={() => setMode('choose')} className="text-sm text-gray-500 hover:text-gray-700 mb-4 flex items-center gap-1">← Back</button>
      <h2 className="text-lg font-semibold text-gray-900 mb-1">Find your submission</h2>
      <p className="text-sm text-gray-500 mb-6">Enter your CoStar email and the agency name you submitted.</p>
      <div className="space-y-4">
        <div><Label required>Your CoStar email</Label><Input value={lookupEmail} onChange={e=>setLookupEmail(e.target.value)} placeholder="you@costar.com" /></div>
        <div><Label required>Agency name</Label><Input value={lookupAgency} onChange={e=>setLookupAgency(e.target.value)} placeholder="Exact agency name as submitted" /></div>
        {lookupErr && <p className="text-red-600 text-sm">{lookupErr}</p>}
        <Btn onClick={handleLookup} className="w-full">Find my submission</Btn>
      </div>
    </Card></div>
  );
  if (mode==='success') return (
    <div className="max-w-lg mx-auto mt-12 px-4"><Card className="p-8 text-center">
      <div className="w-14 h-14 bg-green-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><svg className="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg></div>
      <h2 className="text-xl font-semibold text-gray-900 mb-2">{editId ? 'Submission updated!' : 'Submitted successfully!'}</h2>
      <p className="text-gray-500 text-sm mb-2"><strong>{submitted?.agencyName}</strong> has been added to the waitlist.</p>
      <p className="text-gray-500 text-sm mb-6">Angela / Rob will review your submission and be in touch.</p>
      <div className="flex flex-col gap-3">
        <a href={mailtoLink} className="inline-flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>Send confirmation email</a>
        <Btn variant="secondary" onClick={() => { setMode('choose'); setForm(EMPTY); setStep(0); }}>Submit another agency</Btn>
      </div>
    </Card></div>
  );
  return (
    <div className="max-w-2xl mx-auto mt-8 px-4 pb-12">
      <div className="mb-6"><button onClick={() => setMode('choose')} className="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-1">← Back</button><h1 className="text-2xl font-bold text-gray-900 mt-2">{editId ? 'Edit Submission' : 'Submit a Pilot Agency'}</h1></div>
      <StepBar steps={STEPS} current={step} />
      <Card className="p-6">
        {step===0 && <div className="space-y-4"><h2 className="text-lg font-semibold text-gray-900 mb-4">Your details</h2><div><Label required>Full name</Label><Input value={form.submitterName} onChange={e=>set('submitterName',e.target.value)} placeholder="Jane Smith" />{err('submitterName')}</div><div><Label required>Title / Role</Label><Input value={form.submitterTitle} onChange={e=>set('submitterTitle',e.target.value)} placeholder="Senior Account Manager" />{err('submitterTitle')}</div><div><Label required>CoStar email</Label><Input value={form.submitterEmail} onChange={e=>set('submitterEmail',e.target.value)} placeholder="you@costar.com" type="email" />{err('submitterEmail')}</div></div>}
        {step===1 && <div><h2 className="text-lg font-semibold text-gray-900 mb-2">Before you proceed</h2><p className="text-sm text-gray-500 mb-6">Please confirm both of the following before submitting.</p><div className="space-y-4"><label className="flex items-start gap-3 cursor-pointer"><input type="checkbox" className="mt-0.5 w-4 h-4 rounded border-gray-300 text-blue-600" checked={form.checkedWaitlist} onChange={e=>set('checkedWaitlist',e.target.checked)} /><span className="text-sm text-gray-700">I have checked the <strong>Waitlist</strong> and confirmed this agency has not already been submitted.</span></label><label className="flex items-start gap-3 cursor-pointer"><input type="checkbox" className="mt-0.5 w-4 h-4 rounded border-gray-300 text-blue-600" checked={form.meetsCriteria} onChange={e=>set('meetsCriteria',e.target.checked)} /><span className="text-sm text-gray-700">I have confirmed this agency <strong>meets the Hub pilot criteria</strong>.</span></label></div>{(!form.checkedWaitlist||!form.meetsCriteria)&&<div className="mt-6 p-4 bg-amber-50 border border-amber-200 rounded-lg"><p className="text-sm text-amber-800 font-medium">Not sure if your agency qualifies?</p><p className="text-sm text-amber-700 mt-1">Please chat with <a href={`mailto:${CONTACT_EMAIL}`} className="font-medium underline">Angela Yu</a> before proceeding.</p></div>}</div>}
        {step===2 && <div className="space-y-4"><h2 className="text-lg font-semibold text-gray-900 mb-4">Agency details</h2><div className="grid grid-cols-2 gap-4"><div className="col-span-2"><Label required>Agency Name</Label><Input value={form.agencyName} onChange={e=>set('agencyName',e.target.value)} placeholder="Acme Real Estate" />{err('agencyName')}</div><div className="col-span-2"><Label required>Brand Name</Label><Input value={form.brandName} onChange={e=>set('brandName',e.target.value)} placeholder="Acme" />{err('brandName')}</div><div><Label>Campaigntrack Agency ID</Label><Input value={form.ctAgencyId} onChange={e=>set('ctAgencyId',e.target.value)} placeholder="CT-12345" /></div><div><Label>Realhub Agency ID</Label><Input value={form.rhAgencyId} onChange={e=>set('rhAgencyId',e.target.value)} placeholder="RH-67890" /></div><div><Label required>Marketing Platform</Label><Sel value={form.marketingPlatform} onChange={e=>set('marketingPlatform',e.target.value)}><option value="">Select platform…</option><option>Realhub</option><option>Campaigntrack</option></Sel>{err('marketingPlatform')}</div><div><Label required>Artwork Builder</Label><Sel value={form.artworkBuilder} onChange={e=>set('artworkBuilder',e.target.value)}><option value="">Select…</option><option>RHAWB</option><option>Other</option></Sel>{err('artworkBuilder')}</div></div></div>}
        {step===3 && <div className="space-y-4"><h2 className="text-lg font-semibold text-gray-900 mb-4">Main user details</h2><div className="grid grid-cols-2 gap-4"><div><Label required>Name</Label><Input value={form.userName} onChange={e=>set('userName',e.target.value)} placeholder="John Doe" />{err('userName')}</div><div><Label required>Role</Label><Input value={form.userRole} onChange={e=>set('userRole',e.target.value)} placeholder="Office Manager" />{err('userRole')}</div><div><Label>CT Username</Label><Input value={form.ctUsername} onChange={e=>set('ctUsername',e.target.value)} placeholder="jdoe@acme.com.au" /></div><div><Label>RH User ID</Label><Input value={form.rhUserId} onChange={e=>set('rhUserId',e.target.value)} placeholder="123456" /></div></div><div className="mt-2 border border-gray-200 rounded-lg p-4"><p className="text-sm font-medium text-gray-700 mb-2">Access &amp; permissions</p><Toggle label="CT Access" value={form.toggleCTAccess} onChange={v=>set('toggleCTAccess',v)} /><Toggle label="RH Access" value={form.toggleRHAccess} onChange={v=>set('toggleRHAccess',v)} /><Toggle label="Primary Contact" value={form.togglePrimaryContact} onChange={v=>set('togglePrimaryContact',v)} /></div></div>}
        {step===4 && <div><h2 className="text-lg font-semibold text-gray-900 mb-4">Review your submission</h2><div className="space-y-4 text-sm"><RSection title="Submitter"><RRow label="Name" value={form.submitterName} /><RRow label="Title" value={form.submitterTitle} /><RRow label="Email" value={form.submitterEmail} /></RSection><RSection title="Agency"><RRow label="Agency Name" value={form.agencyName} /><RRow label="Brand Name" value={form.brandName} /><RRow label="CT Agency ID" value={form.ctAgencyId||'—'} /><RRow label="RH Agency ID" value={form.rhAgencyId||'—'} /><RRow label="Marketing Platform" value={form.marketingPlatform} /><RRow label="Artwork Builder" value={form.artworkBuilder} /></RSection><RSection title="Main User"><RRow label="Name" value={form.userName} /><RRow label="Role" value={form.userRole} /><RRow label="CT Username" value={form.ctUsername||'—'} /><RRow label="RH User ID" value={form.rhUserId||'—'} /><RRow label="CT Access" value={form.toggleCTAccess} /><RRow label="RH Access" value={form.toggleRHAccess} /><RRow label="Primary Contact" value={form.togglePrimaryContact} /></RSection></div></div>}
        <div className="flex justify-between mt-8">
          <Btn variant="secondary" onClick={() => step===0 ? setMode('choose') : setStep(s=>s-1)}>{step===0 ? 'Cancel' : '← Back'}</Btn>
          {step<STEPS.length-1 ? <Btn onClick={next} disabled={step===1&&(!form.checkedWaitlist||!form.meetsCriteria)}>Next →</Btn> : <Btn onClick={handleSubmit}>{editId ? 'Save changes' : 'Submit agency'}</Btn>}
        </div>
      </Card>
    </div>
  );
}
function WaitlistPage({ submissions }) {
  const list = submissions.filter(s=>s.status==='Waitlist').sort((a,b)=>new Date(a.submittedAt)-new Date(b.submittedAt));
  return (
    <div className="max-w-5xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6"><div><h1 className="text-2xl font-bold text-gray-900">Waitlist</h1><p className="text-gray-500 text-sm mt-1">{list.length} {list.length===1?'agency':'agencies'} pending review</p></div><Badge status="Waitlist" /></div>
      {list.length===0 ? <Card className="p-12 text-center text-gray-400"><p className="text-lg">No agencies on the waitlist yet.</p><p className="text-sm mt-1">Submissions will appear here once received.</p></Card> : (
        <Card className="overflow-hidden"><table className="w-full text-sm">
          <thead className="bg-gray-50 border-b border-gray-200"><tr>{['Agency Name','Marketing Platform','Artwork Builder','Submitted By','Submitted'].map(h=><th key={h} className="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>)}</tr></thead>
          <tbody className="divide-y divide-gray-100">{list.map(s=><tr key={s.id} className="hover:bg-gray-50"><td className="px-4 py-3 font-medium text-gray-900">{s.agencyName}<div className="text-xs text-gray-400">{s.brandName}</div></td><td className="px-4 py-3 text-gray-700">{s.marketingPlatform}</td><td className="px-4 py-3 text-gray-700">{s.artworkBuilder}</td><td className="px-4 py-3 text-gray-700">{s.submitterName}<div className="text-xs text-gray-400">{s.submitterTitle}</div></td><td className="px-4 py-3 text-gray-500 whitespace-nowrap">{fmtDate(s.submittedAt)}</td></tr>)}</tbody>
        </table></Card>
      )}
    </div>
  );
}
function ApprovedLivePage({ submissions }) {
  const [filter, setFilter] = useState('All');
  const base=submissions.filter(s=>s.status==='Approved'||s.status==='Live'), filtered=filter==='All'?base:base.filter(s=>s.status===filter);
  const counts={All:base.length,Approved:base.filter(s=>s.status==='Approved').length,Live:base.filter(s=>s.status==='Live').length};
  return (
    <div className="max-w-5xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6 flex-wrap gap-3"><div><h1 className="text-2xl font-bold text-gray-900">Approved &amp; Live</h1><p className="text-gray-500 text-sm mt-1">{counts.All} {counts.All===1?'agency':'agencies'}</p></div><div className="flex gap-2">{['All','Approved','Live'].map(f=><button key={f} onClick={()=>setFilter(f)} className={`px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors ${filter===f?'bg-blue-50 border-blue-200 text-blue-700':'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>{f} <span className="ml-1 opacity-60 text-xs">({counts[f]})</span></button>)}</div></div>
      {filtered.length===0 ? <Card className="p-12 text-center text-gray-400">No agencies {filter!=='All'?`with status "${filter}"`:' approved yet'}.</Card> : (
        <Card className="overflow-hidden"><table className="w-full text-sm">
          <thead className="bg-gray-50 border-b border-gray-200"><tr>{['Agency Name','Marketing Platform','Status','Approved','Live'].map(h=><th key={h} className="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>)}</tr></thead>
          <tbody className="divide-y divide-gray-100">{filtered.sort((a,b)=>new Date(b.approvedAt||b.submittedAt)-new Date(a.approvedAt||a.submittedAt)).map(s=><tr key={s.id} className="hover:bg-gray-50"><td className="px-4 py-3 font-medium text-gray-900">{s.agencyName}<div className="text-xs text-gray-400">{s.brandName}</div></td><td className="px-4 py-3 text-gray-700">{s.marketingPlatform}</td><td className="px-4 py-3"><Badge status={s.status} /></td><td className="px-4 py-3 text-gray-500 whitespace-nowrap">{fmtDate(s.approvedAt)}</td><td className="px-4 py-3 text-gray-500 whitespace-nowrap">{fmtDate(s.liveAt)}</td></tr>)}</tbody>
        </table></Card>
      )}
    </div>
  );
}
const STATUS_OPTIONS=['Waitlist','Approved','Live'];
function AdminPage({ submissions, onUpdateStatus }) {
  const [authed,setAuthed]=useState(false),[pw,setPw]=useState(''),[pwErr,setPwErr]=useState(''),[pending,setPending]=useState({}),[saving,setSaving]=useState({}),[saved,setSaved]=useState({}),[expanded,setExpanded]=useState(null),[search,setSearch]=useState(''),[sf,setSf]=useState('All');
  const filtered=submissions.filter(s=>sf==='All'||s.status===sf).filter(s=>!search||[s.agencyName,s.brandName,s.submitterName,s.submitterEmail].some(v=>v?.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  if (!authed) return (
    <div className="max-w-sm mx-auto mt-20 px-4"><Card className="p-8 text-center">
      <div className="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center mx-auto mb-4"><svg className="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></div>
      <h2 className="text-lg font-semibold text-gray-900 mb-4">Admin access</h2>
      <Input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Enter admin password" onKeyDown={e=>{if(e.key==='Enter'){if(pw===ADMIN_SECRET)setAuthed(true);else setPwErr('Incorrect password');}}} />
      {pwErr&&<p className="text-red-500 text-xs mt-1">{pwErr}</p>}
      <Btn className="w-full mt-4" onClick={()=>{if(pw===ADMIN_SECRET)setAuthed(true);else setPwErr('Incorrect password');}}>Sign in</Btn>
      <p className="text-xs text-gray-400 mt-4">Update <code className="bg-gray-100 px-1 rounded">ADMIN_SECRET</code> in the HTML to change the password.</p>
    </Card></div>
  );
  async function handleSave(id) {
    const cur=submissions.find(s=>s.id===id); if (!pending[id]||pending[id]===cur?.status) return;
    setSaving(p=>({...p,[id]:true})); const patch={status:pending[id]};
    if (pending[id]==='Approved'&&!cur.approvedAt) patch.approvedAt=new Date().toISOString();
    if (pending[id]==='Live') { patch.liveAt=new Date().toISOString(); if (!cur.approvedAt) patch.approvedAt=new Date().toISOString(); }
    await onUpdateStatus(id,patch); setPending(p=>{const c={...p};delete c[id];return c;}); setSaved(p=>({...p,[id]:true})); setTimeout(()=>setSaved(p=>{const c={...p};delete c[id];return c;}),2500); setSaving(p=>{const c={...p};delete c[id];return c;});
  }
  return (
    <div className="max-w-6xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between mb-6"><div><h1 className="text-2xl font-bold text-gray-900">Admin — Manage Submissions</h1><p className="text-gray-500 text-sm mt-1">{submissions.length} total submissions</p></div><Btn variant="secondary" onClick={()=>setAuthed(false)}>Sign out</Btn></div>
      <div className="flex gap-3 mb-4 flex-wrap items-center">
        <Input className="max-w-xs" placeholder="Search agency, name, email…" value={search} onChange={e=>setSearch(e.target.value)} />
        <div className="flex gap-2">{['All',...STATUS_OPTIONS].map(f=><button key={f} onClick={()=>setSf(f)} className={`px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors ${sf===f?'bg-blue-50 border-blue-200 text-blue-700':'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>{f} <span className="ml-1 opacity-60 text-xs">({f==='All'?submissions.length:submissions.filter(s=>s.status===f).length})</span></button>)}</div>
      </div>
      {filtered.length===0 ? <Card className="p-12 text-center text-gray-400">No submissions found.</Card> : (
        <Card className="overflow-hidden"><table className="w-full text-sm">
          <thead className="bg-gray-50 border-b border-gray-200"><tr>{['Agency','Platform','Submitted By','Submitted','Current Status','Update Status',''].map(h=><th key={h} className="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>)}</tr></thead>
          <tbody className="divide-y divide-gray-100">{filtered.map(s=>(
            <React.Fragment key={s.id}>
              <tr className="hover:bg-gray-50">
                <td className="px-4 py-3"><button onClick={()=>setExpanded(expanded===s.id?null:s.id)} className="font-medium text-gray-900 hover:text-blue-600 text-left">{s.agencyName} <span className="text-blue-400 text-xs">{expanded===s.id?'▲':'▼'}</span></button><div className="text-xs text-gray-400">{s.brandName}</div></td>
                <td className="px-4 py-3 text-gray-700">{s.marketingPlatform}</td>
                <td className="px-4 py-3 text-gray-700">{s.submitterName}<div className="text-xs text-gray-400">{s.submitterEmail}</div></td>
                <td className="px-4 py-3 text-gray-500 whitespace-nowrap">{fmtDate(s.submittedAt)}</td>
                <td className="px-4 py-3"><Badge status={s.status} /></td>
                <td className="px-4 py-3"><Sel className="w-32" value={pending[s.id]??s.status} onChange={e=>setPending(p=>({...p,[s.id]:e.target.value}))}>{STATUS_OPTIONS.map(o=><option key={o}>{o}</option>)}</Sel></td>
                <td className="px-4 py-3 whitespace-nowrap">{pending[s.id]&&pending[s.id]!==s.status?<Btn onClick={()=>handleSave(s.id)} disabled={saving[s.id]}>{saving[s.id]?'Saving…':'Save'}</Btn>:saved[s.id]?<span className="text-green-600 text-xs font-medium">✓ Saved</span>:null}</td>
              </tr>
              {expanded===s.id&&<tr className="bg-blue-50"><td colSpan={7} className="px-6 py-4"><div className="grid grid-cols-3 gap-6 text-xs">
                <div><p className="font-semibold text-gray-500 uppercase tracking-wide mb-2">Agency Details</p><p><span className="text-gray-500">CT Agency ID: </span>{s.ctAgencyId||'—'}</p><p><span className="text-gray-500">RH Agency ID: </span>{s.rhAgencyId||'—'}</p><p><span className="text-gray-500">Artwork Builder: </span>{s.artworkBuilder}</p></div>
                <div><p className="font-semibold text-gray-500 uppercase tracking-wide mb-2">Main User</p><p><span className="text-gray-500">Name: </span>{s.userName}</p><p><span className="text-gray-500">Role: </span>{s.userRole}</p><p><span className="text-gray-500">CT Username: </span>{s.ctUsername||'—'}</p><p><span className="text-gray-500">RH User ID: </span>{s.rhUserId||'—'}</p></div>
                <div><p className="font-semibold text-gray-500 uppercase tracking-wide mb-2">Access &amp; Dates</p><p><span className="text-gray-500">CT Access: </span>{s.toggleCTAccess}</p><p><span className="text-gray-500">RH Access: </span>{s.toggleRHAccess}</p><p><span className="text-gray-500">Primary Contact: </span>{s.togglePrimaryContact}</p>{s.approvedAt&&<p className="mt-2"><span className="text-gray-500">Approved: </span>{fmtDT(s.approvedAt)}</p>}{s.liveAt&&<p><span className="text-gray-500">Live: </span>{fmtDT(s.liveAt)}</p>}</div>
              </div></td></tr>}
            </React.Fragment>
          ))}</tbody>
        </table></Card>
      )}
    </div>
  );
}
function App() {
  const [page,setPage]=useState('submit');
  const {submissions,addSubmission,updateSubmission}=useSubmissions();
  async function handleSubmit(formData,editId) { if (editId) { await updateSubmission(editId,formData); return {...submissions.find(s=>s.id===editId),...formData}; } return addSubmission(formData); }
  return <div><Nav page={page} setPage={setPage} />{page==='submit'&&<SubmitPage onSubmit={handleSubmit} submissions={submissions} />}{page==='waitlist'&&<WaitlistPage submissions={submissions} />}{page==='approved'&&<ApprovedLivePage submissions={submissions} />}{page==='admin'&&<AdminPage submissions={submissions} onUpdateStatus={updateSubmission} />}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
